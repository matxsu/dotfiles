palette = "noctalia"
add_newline = true
command_timeout = 200
# Heure (HH:MM:SS) puis user tout à gauche, avant le reste.
format = "$time$username$directory$git_branch$git_status$character"

[time]
disabled = false
time_format = "%H:%M:%S"
format = "[$time]($style) "
style = "bold cyan"

[username]
show_always = true
format = "[$user]($style) "
style_user = "italic cyan"
style_root = "bold red"

[character]
error_symbol = "[✗](bold cyan)"
success_symbol = "[❯](bold cyan)"

[directory]
truncation_length = 2
truncation_symbol = "…/"
repo_root_style = "bold cyan"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$branch]($style) "
style = "italic cyan"

[git_status]
format     = '[$all_status]($style)'
style      = "cyan"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked  = "? "
modified   = " "
stashed    = ""
staged     = ""
renamed    = ""
deleted    = ""

